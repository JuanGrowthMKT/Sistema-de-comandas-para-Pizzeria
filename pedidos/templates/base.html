<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pedidos · Il Forno{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-pedido {
            aspect-ratio: 1 / 1;
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .card-pedido:hover {
            transform: translateY(-3px);
            box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .15);
        }
        .card-pedido .card-body {
            overflow-y: auto;
        }
        .btn-mini {
            padding: .12rem .4rem;
            font-size: .72rem;
            line-height: 1.2;
            border-radius: .2rem;
        }
        .navbar {
            box-shadow: 0 1px 6px rgba(0, 0, 0, .15);
        }
        .navbar .nav-link {
            position: relative;
            transition: color .15s ease;
        }
        .navbar .nav-link::after {
            content: '';
            position: absolute;
            left: 0;
            right: 100%;
            bottom: .2rem;
            height: 2px;
            background: #ffc107;
            transition: right .15s ease;
        }
        .navbar .nav-link:hover::after {
            right: 0;
        }
        .navbar-brand {
            transition: transform .15s ease;
        }
        .navbar-brand:hover {
            transform: scale(1.04);
        }
        .btn-pulso {
            animation: radar-ping 1.6s ease-out infinite;
        }        @keyframes radar-ping {
            0% {
                box-shadow: 0 0 0 0 rgba(220, 53, 69, .55);
            }
            100% {
                box-shadow: 0 0 0 14px rgba(220, 53, 69, 0);
            }
        }
        .bg-danger-tono { background-color: #f8d7da; }
        .bg-success-tono { background-color: #d1e7dd; }
        .bg-primary-tono { background-color: #cfe2ff; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'pedidos' %}">Sistema Il Forno</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <div class="navbar-nav">
                <a class="nav-link {% if seccion == 'pedidos' %}active{% endif %}" href="{% url 'pedidos' %}">Pedidos</a>
                <a class="nav-link {% if seccion == 'panel' %}active{% endif %}" href="{% url 'panel' %}">Panel de Pedidos</a>
                <a class="nav-link {% if seccion == 'ventas' %}active{% endif %}" href="{% url 'ventas' %}">Resumen de ventas</a>
                <a class="nav-link {% if seccion == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">Analítica de ventas</a>
            </div>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="row g-4">
    {% block content %}{% endblock %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/htmx.org@2"></script>
<script>
    var switchMitad = document.getElementById('switchMitad');
    if (switchMitad) {
        switchMitad.addEventListener('change', function (e) {
            document.getElementById('mitadesWrap').classList.toggle('d-none', !e.target.checked);
        });
    }
    document.querySelectorAll('form[data-confirm]').forEach(function (f) {
        f.addEventListener('submit', function (e) {
            if (!confirm(f.getAttribute('data-confirm'))) {
                e.preventDefault();
            }
        });
    });
</script>
