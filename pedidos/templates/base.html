<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pedidos · Il Forno{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0d0d0d 0%, #1a1614 100%);
            --panel-bg: rgba(22, 20, 19, 0.95);
            --card-bg: linear-gradient(145deg, #23201d, #191715);
            --gold: #d4a359;
            --gold-bright: #f5c57a;
            --copper: #b86d3b;
            --text: #ffffff;
            --text-muted: #a09a95;
            --green: #2e7d32;
            --red: #c62828;
        }

        * { font-family: 'Montserrat', sans-serif; }
        body {
            background: var(--bg-gradient);
            color: var(--text);
            min-height: 100vh;
        }

        /* NAVBAR */
        .navbar {
            background: rgba(13, 13, 13, 0.9) !important;
            border-bottom: 1px solid rgba(212, 163, 89, 0.25);
            box-shadow: 0 1px 12px rgba(0, 0, 0, 0.6);
        }
        .navbar-brand {
            color: var(--gold-bright) !important;
            letter-spacing: 1px;
            font-weight: 800;
        }
        .navbar-brand:hover { transform: scale(1.03); transition: transform .15s ease; }
        .navbar .nav-link {
            position: relative;
            color: var(--text-muted) !important;
            font-weight: 600;
            transition: color .15s ease;
        }
        .navbar .nav-link.active { color: var(--gold-bright) !important; }
        .navbar .nav-link::after {
            content: '';
            position: absolute;
            left: 0; right: 100%; bottom: .2rem;
            height: 2px;
            background: var(--gold);
            transition: right .15s ease;
        }
        .navbar .nav-link:hover::after { right: 0; }
        .navbar-dark .navbar-toggler { border-color: rgba(212,163,89,.3); }

        /* CARDS */
        .card {
            background: var(--card-bg) !important;
            border: 1px solid rgba(212, 163, 89, 0.2) !important;
            border-radius: 16px !important;
            box-shadow: 0 8px 25px rgba(0,0,0,.5) !important;
            color: var(--text);
        }
        .card-header {
            background: rgba(20,18,16,.9) !important;
            border-bottom: 1px solid rgba(212, 163, 89, 0.25) !important;
        }
        .card-header h5 { color: var(--gold-bright); font-weight: 700; letter-spacing: .5px; }

        /* INPUTS */
        .form-control, .form-select {
            background-color: #12100f !important;
            border: 1px solid #3d352e !important;
            color: #fff !important;
            border-radius: 8px !important;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--gold) !important;
            box-shadow: 0 0 8px rgba(212,163,89,.3) !important;
            background-color: #12100f !important;
            color: #fff !important;
        }
        .form-control::placeholder { color: #6b645d; }
        .form-label { color: var(--text-muted); font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }

        /* BOTONES */
        .btn-dark, .btn-primary {
            background: linear-gradient(135deg, var(--gold) 0%, var(--copper) 100%) !important;
            border: none !important;
            color: #000 !important;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-dark:hover, .btn-primary:hover { filter: brightness(1.1); }
        .btn-success {
            background: linear-gradient(135deg, #2e7d32, #1b5e20) !important;
            border: none; color: #fff !important; font-weight: 700;
        }
        .btn-danger {
            background: linear-gradient(135deg, #d32f2f, #b71c1c) !important;
            border: none; color: #fff !important; font-weight: 700;
        }
        .btn-outline-dark { color: var(--gold-bright) !important; border-color: var(--gold) !important; }
        .btn-outline-light { color: var(--gold-bright) !important; border-color: rgba(212,163,89,.4) !important; }

        /* BADGES */
        .badge.bg-warning { background: linear-gradient(135deg, var(--gold), var(--copper)) !important; color: #000 !important; }
        .badge.bg-success { background-color: var(--green) !important; }
        .badge.bg-secondary { background-color: #4a4743 !important; }

        /* CARDS DE COCINA */
        .card-pedido {
            aspect-ratio: 1 / 1;
            transition: transform .15s ease, box-shadow .15s ease;
            border: 1px solid rgba(212, 163, 89, 0.25) !important;
            position: relative;
            overflow: hidden;
        }
        .card-pedido::before {
            content: '';
            position: absolute; top: 0; left: 0;
            width: 6px; height: 100%;
            background: linear-gradient(180deg, var(--gold-bright), var(--copper));
        }
        .card-pedido:hover { transform: translateY(-3px); }
        .card-pedido .card-body { overflow-y: auto; }
        .card-pedido.bg-danger-subtle { background: linear-gradient(145deg, #3a1f1f, #261513) !important; }
        .card-pedido.bg-success-subtle { background: linear-gradient(145deg, #1e3a22, #14261a) !important; }

        .btn-mini {
            padding: .12rem .4rem; font-size: .72rem; line-height: 1.2; border-radius: .2rem;
        }
        .btn-pulso { animation: radar-ping 1.6s ease-out infinite; }
        @keyframes radar-ping {
            0% { box-shadow: 0 0 0 0 rgba(220,53,69,.55); }
            100% { box-shadow: 0 0 0 14px rgba(220,53,69,0); }
        }

        /* MISC */
        .bg-danger-tono { background-color: rgba(198,40,40,.15); }
        .bg-success-tono { background-color: rgba(46,125,50,.15); }
        .bg-primary-tono { background-color: rgba(212,163,89,.15); }
        .text-muted { color: var(--text-muted) !important; }
        hr { border-color: rgba(255,255,255,.08); }
        .table { color: var(--text); }
        .table-light { --bs-table-bg: #201c19; color: var(--gold-bright); }
        .table-hover tbody tr:hover { --bs-table-hover-bg: #2a2522; color: #fff; }
        .input-group-text { background-color: #12100f; border-color: #3d352e; color: var(--text-muted); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'pedidos' %}">Sistema Il Forno</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <div class="navbar-nav">
                <a class="nav-link {% if seccion == 'pedidos' %}active{% endif %}" href="{% url 'pedidos' %}">Pedidos</a>
                <a class="nav-link {% if seccion == 'panel' %}active{% endif %}" href="{% url 'panel' %}">Panel de Pedidos</a>
                <a class="nav-link {% if seccion == 'ventas' %}active{% endif %}" href="{% url 'ventas' %}">Resumen de ventas</a>
                <a class="nav-link {% if seccion == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">Analítica de ventas</a>
            </div>
            <div class="d-flex ms-auto mt-2 mt-lg-0">
                {% if user.is_authenticated %}
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Salir ({{ user.username }})</button>
                </form>
                {% endif %}
            </div>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="row g-4">
    {% block content %}{% endblock %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/htmx.org@2"></script>
<script>
    document.querySelectorAll('form[data-confirm]').forEach(function (f) {
        f.addEventListener('submit', function (e) {
            if (!confirm(f.getAttribute('data-confirm'))) {
                e.preventDefault();
            }
        });
    });
</script>
{% block extra_js %}{% endblock %}
