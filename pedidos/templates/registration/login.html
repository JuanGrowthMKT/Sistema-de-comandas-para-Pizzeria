{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Il Forno</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0d0d0d 0%, #1a1614 100%);
            --card-bg: linear-gradient(145deg, #23201d, #191715);
            --gold: #d4a359;
            --gold-bright: #f5c57a;
            --copper: #b86d3b;
            --text-muted: #a09a95;
        }
        * { font-family: 'Montserrat', sans-serif; }
        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            background: var(--card-bg);
            border: 1px solid rgba(212,163,89,.25);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,.6);
        }
        .login-header { background: rgba(20,18,16,.9); border-radius: 16px 16px 0 0; border-bottom: 1px solid rgba(212,163,89,.3); }
        .login-header h5 { color: var(--gold-bright); font-weight: 800; letter-spacing: 1px; }
        .form-control {
            background-color: #12100f; border: 1px solid #3d352e; color: #fff; border-radius: 8px;
        }
        .form-control:focus { border-color: var(--gold); box-shadow: 0 0 8px rgba(212,163,89,.3); background-color: #12100f; color: #fff; }
        .form-label { color: var(--text-muted); font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
        .btn-entrar {
            background: linear-gradient(135deg, var(--gold), var(--copper));
            border: none; color: #000; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-entrar:hover { filter: brightness(1.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-8 col-md-6 col-lg-4">
                <div class="login-card">
                    <div class="login-header text-center py-3">
                        <h5 class="mb-0">Sistema Il Forno</h5>
                    </div>
                    <div class="card-body p-4">
                        {% if form.errors %}
                            <div class="alert alert-danger py-2 small">Usuario o contraseña incorrectos.</div>
                        {% endif %}
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label">USUARIO</label>
                                <input type="text" name="username" class="form-control" autofocus required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">CONTRASEÑA</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-entrar w-100">Entrar</button>
                            <input type="hidden" name="next" value="{{ next }}">
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
